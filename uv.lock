version = 1
revision = 5
requires-python = ">=3.12"

[manifest]
members = [
    "loom-contracts",
    "loom-runner-claude",
]

[[package]]
name = "loom-contracts"
version = "0.1.0"
source = { editable = "packages/loom-contracts" }

[[package]]
name = "loom-runner-claude"
version = "0.1.0"
source = { editable = "packages/loom-runner-claude" }
dependencies = [
    { name = "loom-contracts" },
]

[package.metadata]
requires-dist = [{ name = "loom-contracts", editable = "packages/loom-contracts" }]
