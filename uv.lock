version = 1
revision = 5
requires-python = ">=3.12"

[manifest]
members = [
    "loom-client",
    "loom-contracts",
    "loom-core",
    "loom-runner-claude",
    "loom-service",
]

[[package]]
name = "loom-client"
version = "0.1.0"
source = { editable = "packages/loom-client" }
dependencies = [
    { name = "loom-contracts" },
]

[package.metadata]
requires-dist = [{ name = "loom-contracts", editable = "packages/loom-contracts" }]

[[package]]
name = "loom-contracts"
version = "0.1.0"
source = { editable = "packages/loom-contracts" }

[[package]]
name = "loom-core"
version = "0.1.0"
source = { editable = "packages/loom-core" }
dependencies = [
    { name = "loom-contracts" },
]

[package.metadata]
requires-dist = [{ name = "loom-contracts", editable = "packages/loom-contracts" }]

[[package]]
name = "loom-runner-claude"
version = "0.1.0"
source = { editable = "packages/loom-runner-claude" }
dependencies = [
    { name = "loom-contracts" },
]

[package.metadata]
requires-dist = [{ name = "loom-contracts", editable = "packages/loom-contracts" }]

[[package]]
name = "loom-service"
version = "0.1.0"
source = { editable = "packages/loom-service" }
dependencies = [
    { name = "loom-core" },
    { name = "loom-runner-claude" },
]

[package.metadata]
requires-dist = [
    { name = "loom-core", editable = "packages/loom-core" },
    { name = "loom-runner-claude", editable = "packages/loom-runner-claude" },
]
