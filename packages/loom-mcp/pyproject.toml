[project]
name = 'loom-mcp'
version = '0.1.0'
requires-python = '>=3.12'
dependencies = ['loom-client']

[project.scripts]
loom-mcp = 'loom_mcp.server:main'

[tool.uv.sources]
loom-client = { workspace = true }

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel]
packages = ['loom_mcp']
