[project]
name = 'loom-service'
version = '0.1.0'
requires-python = '>=3.12'
dependencies = ['loom-core', 'loom-runner-claude', 'loom-scheduler']

[tool.uv.sources]
loom-core = { workspace = true }
loom-runner-claude = { workspace = true }
loom-scheduler = { workspace = true }

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel]
packages = ['loom_service']
